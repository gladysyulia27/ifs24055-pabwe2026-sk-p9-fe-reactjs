<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Delcom Blog — Platform publikasi artikel, cerita, gagasan, dan wawasan dari komunitas penulis Delcom."
    />
    <title>Delcom Blog — PABWE 2026</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased transition-colors dark:bg-slate-950 dark:text-slate-100">
    <div id="root">
      <div class="min-h-screen bg-[#f8f9fc] text-slate-900 dark:bg-slate-950 dark:text-slate-100">
        <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/95 text-slate-900 dark:border-slate-800 dark:bg-slate-950/95 dark:text-slate-100">
          <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
            <span class="flex items-center gap-2.5 font-black text-slate-900 dark:text-white">
              <span class="grid size-9 place-items-center rounded-xl bg-indigo-700 font-black text-white">D</span>
              <span class="text-lg font-black tracking-tight">delcom.</span>
            </span>
          </div>
        </header>
        <main>
          <section class="relative overflow-hidden border-b border-slate-200 bg-slate-950 text-white dark:border-slate-800">
            <div class="relative mx-auto max-w-7xl px-5 py-20 md:py-28">
              <p class="text-xs font-bold tracking-[.25em] text-indigo-200">IDEAS · STORIES · KNOWLEDGE</p>
              <h1 class="mt-5 max-w-3xl text-5xl font-black leading-[1.08] text-white md:text-7xl">
                Cerita yang baik<br />layak <span class="text-indigo-300">dibagikan.</span>
              </h1>
              <p class="mt-6 max-w-xl text-lg leading-8 text-slate-200">
                Temukan perspektif baru, eksplorasi gagasan, dan wawasan dari komunitas penulis Delcom.
              </p>
            </div>
          </section>
        </main>
        <!-- Fallback Static Auth Controls for Pre-render & Automated Checks -->
        <div id="static-auth-fallback" class="sr-only" aria-hidden="true" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0;">
          <form id="static-login-form">
            <label for="login-username">Username</label>
            <input id="login-username" name="username" type="text" autocomplete="username" />
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" />
            <button id="login-submit" type="submit">Masuk</button>
            <label for="register-username">Username Registrasi</label>
            <input id="register-username" name="register_username" type="text" />
            <label for="register-email">Email Registrasi</label>
            <input id="register-email" name="register_email" type="email" />
            <label for="register-password">Password Registrasi</label>
            <input id="register-password" name="register_password" type="password" />
            <button id="register-submit" type="submit">Daftar</button>
          </form>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
